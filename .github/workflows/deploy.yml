name: Deploy to VPS

on:
  push:
    branches:
      - develop-docker

jobs:
  # ─── Job 1: Unit Test ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pdo_mysql, redis, zip, gd, bcmath
          coverage: none

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Unit Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log
        run: ./vendor/bin/pest tests/Unit

  # ─── Job 2: Deploy (hanya jika test lulus) ───────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/miftahul-ulum

            echo "=== Pull latest code ==="
            git pull origin develop-docker

            echo "=== Build assets ==="
            docker compose run --rm vite npm run build || true

            echo "=== Rebuild PHP containers ==="
            docker compose up --build -d app queue reverb

            echo "=== Run migrations ==="
            docker compose exec -T app php artisan migrate --force

            echo "=== Clear & cache config ==="
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan optimize

            echo "=== Fix permissions ==="
            docker compose exec -T app chmod -R 777 storage bootstrap/cache

            echo "=== Done! ==="
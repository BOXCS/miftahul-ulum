server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Proxy semua request Vite (asset + HMR WebSocket)
    location ~* ^/@(vite|fs|id|react-refresh) {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location ~* \.(js|jsx|ts|tsx|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        # Coba serve static file dulu, kalau tidak ada forward ke Vite
        try_files $uri @vite;
        expires max;
        log_not_found off;
    }

    location @vite {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Vite HMR WebSocket
    location /vite-hmr {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    client_max_body_size 20M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}